name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # one static page per church (/kostel/<id>/) — web deploy only; the
          # native builds (android job, release-*, fastlane) leave it off so the
          # app bundle doesn't carry ~4 000 SEO pages
          PRERENDER_CHURCHES: '1'
      # read back what we publish (Standard rule 15): a church link must be a
      # real page with its own title, not the 404 fallback
      - name: Church pages exist
        run: node scripts/check-prerender.mjs
      # iOS 15 WebKit (the app's deployment target) can't parse regex lookbehind;
      # one literal anywhere in a bundle — ours or a dependency's — blanks the app
      - name: No regex lookbehind in the bundle
        run: |
          if grep -l '(?<[=!]' dist/assets/*.js; then
            echo "::error::regex lookbehind in the bundle — breaks iOS < 16.4"
            exit 1
          fi
      # workflow_dispatch deploys too — the refresh-data workflow pushes with
      # GITHUB_TOKEN (which can't fire the push trigger) and then dispatches this
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: dist

  # The Android shell must keep compiling on every change — an unbuildable
  # android/ dir is exactly the silent rot §14 of the iOS standard warns about.
  # Debug build, no signing, no upload; the signed release lives in
  # release-android.yml.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ls -la app/build/outputs/apk/debug/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
