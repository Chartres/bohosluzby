# Scheduled registry refresh — P5/P6/P7 run on data freshness (docs/PERSONAS.md).
# Monthly by cron plus seasonal-boundary runs (parishes flip schedules at the
# school year, Christmas, and around Easter); workflow_dispatch stays the escape
# hatch for anything last-minute.
name: Refresh data

on:
  schedule:
    - cron: '17 2 3 * *' # 3rd of each month, 02:17 UTC
    - cron: '17 2 1 9 *' # 1 Sep — school year starts, summer schedules end
    - cron: '17 2 15 12 *' # 15 Dec — before the 20-24 Dec peak
    - cron: '17 2 15 3 *' # 15 Mar + 5 Apr — Easter moves (22 Mar-25 Apr);
    - cron: '17 2 5 4 *' #   two runs bracket most Holy Weeks
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch ci.yml after the data push (GITHUB_TOKEN pushes don't trigger it)

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # Aug 2026: a manual run hit the old 120-min cap and died as 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Keep previous index for the sanity gate
        run: cp public/data/churches.json /tmp/churches-before.json

      - name: Scrape registry (resumable, ≤3 req/s)
        run: node data/extract.mjs

      # A partial or broken scrape must never replace good data: require at
      # least 90% of the previous church count before committing anything.
      - name: Sanity gate
        run: |
          node -e '
            const fs = require("fs")
            const before = JSON.parse(fs.readFileSync("/tmp/churches-before.json")).length
            const after = JSON.parse(fs.readFileSync("public/data/churches.json")).length
            console.log(`churches: ${before} -> ${after}`)
            if (after < before * 0.9) {
              console.error("refusing to commit: new index is <90% of the previous one")
              process.exit(1)
            }
          '

      - name: Check parish website liveness (drops dead www links from the served data)
        run: node scripts/linkcheck-www.mjs

      - name: Tests still green on fresh data
        run: npm run typecheck && npm test

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data docs/linkcheck-report.md
          if git diff --cached --quiet; then
            echo "registry unchanged — nothing to commit"
          else
            git commit -m "data: registry refresh ($(date -u +%Y-%m-%d))"
            # the scrape runs ~75+ min — main may have moved under us (the
            # 2026-09-01 run lost its whole crawl to a non-fast-forward push);
            # rebase the one data commit onto current main before pushing
            git pull --rebase origin main
            git push
            # GITHUB_TOKEN pushes don't fire the push trigger — dispatch CI so
            # the fresh data actually deploys (ci.yml deploys dispatch runs on main)
            curl -sS -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
              -d '{"ref":"main"}'
          fi

      # A dead refresh must be loud (the Aug 2026 timeout surfaced only when a
      # human asked why the data was stale). Failure AND timeout (which GitHub
      # reports as 'cancelled') open/refresh an issue.
      - name: Raise an issue when the refresh dies
        if: failure() || cancelled()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Registry refresh failed ($(date -u +%Y-%m-%d))\",\"body\":\"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — status \`${{ job.status }}\`. The app keeps serving the last good data; re-run the workflow or investigate the scraper.\",\"labels\":[\"data\"]}" 
