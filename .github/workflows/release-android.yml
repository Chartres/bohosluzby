# Android release — flywheel docs/standards/release-mobile.md (template, stamped by
# flywheel scripts/stamp-release-mobile.mjs; reference run: bohosluzby, Nov 2026).
# Tag `android-vX.Y.Z` (or run by hand) → web build → cap sync → gates → signed AAB +
# APK → GitHub Release assets → (when PLAY_SERVICE_ACCOUNT_JSON exists) fastlane
# supply uploads the AAB to the Google Play INTERNAL testing track. Never closed/open
# testing or production: promoting a release is the owner's step in Play Console
# (docs/ANDROID-RELEASE.md). Ships dark without the secrets: the build still runs and
# the unsigned artifacts are attached, so CI never blocks on credentials that live
# outside the repo. Listing text + graphics (store-assets/android/metadata, checked by
# scripts/play-listing.mjs) go up only when run by hand with upload_listing.
#
# Secrets (repo → Settings → Secrets → Actions), all set by scripts/android-keystore.sh:
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64
#   ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional; scripts/android-keystore.sh --play-json FILE)
# Plus the web build's VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY: without them
# the analytics guard fails the build (an app sending no events).
name: Release Android

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: versionName (e.g. 1.2.0); defaults to the tag or build.gradle
        required: false
        default: ''
      upload_listing:
        description: Also push the store listing (store-assets/android/metadata) with this build — only after the owner approved the text
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false # never kill an upload halfway

jobs:
  build:
    # Public repo: ubuntu-latest. Private repo: the runner switch from
    # docs/standards/runners.md (the mini has a JDK; setup-android installs the SDK).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      # Gate 1: Play refuses uploads below its target API floor (36 since 31 Aug 2026).
      # Fails here, minutes before a rejected upload would.
      - name: Target API at Play's floor
        run: node scripts/android-gates.mjs --gradle android/variables.gradle

      - name: Web build (same env as the site — analytics keys are publishable)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      # The exact JS gradle packages; a build without VITE_SUPABASE_URL ships an
      # app that sends no events, so it fails here (unlike signing, no dark mode).
      - name: Analytics config in the bundle
        run: node scripts/check-analytics.mjs android/app/src/main/assets/public # flywheel:analytics-guard

      - name: Resolve version
        id: v
        run: |
          name="${VERSION#android-v}"
          if [ -z "$name" ]; then
            name=$(sed -n "s/.*findProperty('versionName') ?: '\([^']*\)'.*/\1/p" android/app/build.gradle)
          fi
          # monotonic build number: Play needs every upload's versionCode higher than the last
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code"

      - name: Upload keystore (from secrets; absent → unsigned build, loud notice)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building UNSIGNED. Run scripts/android-keystore.sh once to create + store the upload key."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Gradle — bundleRelease + assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionName="${{ steps.v.outputs.name }}" -PversionCode="${{ steps.v.outputs.code }}"
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release

      - name: Rename artifacts
        run: |
          v="${{ steps.v.outputs.name }}"; c="${{ steps.v.outputs.code }}"
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/kam-na-msi-${v}-${c}.aab"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "out/kam-na-msi-${v}-${c}.apk"
          ls -la out

      # Gate 2: read back what was built — versionName, the merged manifest's
      # permissions (no undeclared policy-sensitive ones), signature, 16 KB alignment.
      - name: Read back — version, permissions, signature, 16 KB page size
        run: |
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt2" dump badging out/*.apk > badging.txt
          grep -E "^package:|uses-permission" badging.txt | head -12
          grep -q "versionName='${{ steps.v.outputs.name }}'" badging.txt || { echo "::error::versionName mismatch"; exit 1; }
          node scripts/android-gates.mjs --badging badging.txt
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            "$bt/apksigner" verify --print-certs out/*.apk | head -3
          fi
          # Play blocks updates without 16 KB page-size support from 1 Feb 2027. Only
          # native code (.so) can break it; a Java/Kotlin-only app passes by construction.
          if unzip -l out/*.apk | grep -q '\.so$'; then
            "$bt/zipalign" -c -P 16 -v 4 out/*.apk > zipalign.log || { tail -5 zipalign.log; echo "::error::native libraries are not 16 KB aligned"; exit 1; }
          else
            echo "no native libraries — 16 KB page size requirement met"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kam-na-msi-android-${{ steps.v.outputs.name }}
          path: out/*

      - name: GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Android ${{ steps.v.outputs.name }}
          files: out/*
          body: |
            Kam na mši for Android — versionName ${{ steps.v.outputs.name }}, versionCode ${{ steps.v.outputs.code }}.
            `.aab` is the Play Store upload; `.apk` installs directly (sideload / testers).
            Signed: ${{ steps.ks.outputs.signed }}.

      # A step's own env isn't visible to its `if`, and secrets can't be read
      # there at all, so probe the secret here and gate on the output.
      - name: Play service account present?
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "set=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Gate 3: the listing fastlane would upload stays inside Play's limits.
      - name: Store listing within Play's limits
        run: node scripts/play-listing.mjs

      - uses: ruby/setup-ruby@v1
        if: steps.ks.outputs.signed == 'true' && steps.play.outputs.set == 'true'
        with:
          ruby-version: '3.3'

      - name: fastlane
        if: steps.ks.outputs.signed == 'true' && steps.play.outputs.set == 'true'
        run: gem install fastlane -N -v 2.241.2

      # Internal track only. An app that has never been published accepts only
      # draft releases ("Only releases with status draft may be created on draft
      # app"): then the upload is retried as a draft, which the owner rolls out
      # once in Play Console; later uploads go straight to testers.
      # With upload_listing the same call also pushes text + graphics: supply
      # attaches listing changes to a release, and before launch the only
      # release that exists is this internal one (a listing-only call looks
      # for production and fails).
      - name: Google Play — upload to the internal track
        if: steps.ks.outputs.signed == 'true' && steps.play.outputs.set == 'true'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077; printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          SKIP_LISTING=$([ "${{ inputs.upload_listing }}" = "true" ] && echo false || echo true)
          up() {
            fastlane run supply package_name:org.dravec.bohosluzby track:internal \
              aab:"$(ls out/*.aab)" release_status:"$1" json_key:"$RUNNER_TEMP/play.json" \
              metadata_path:store-assets/android/metadata skip_upload_metadata:"$SKIP_LISTING" \
              skip_upload_images:"$SKIP_LISTING" skip_upload_screenshots:"$SKIP_LISTING" skip_upload_apk:true 2>&1 | tee supply.log
            return "${PIPESTATUS[0]}"
          }
          if up completed; then
            echo "::notice::Uploaded versionCode ${{ steps.v.outputs.code }} to the internal track (rolled out to internal testers)."
            if [ "$SKIP_LISTING" = "false" ]; then echo "::notice::Store listing (text + graphics) uploaded from store-assets/android/metadata."; fi
          elif grep -q "draft app" supply.log; then
            up draft
            echo "::notice::The app is not published yet, so versionCode ${{ steps.v.outputs.code }} is a DRAFT on the internal track. Play Console → Testing → Internal testing → Edit release → Review → Start rollout (once)."
          else
            exit 1
          fi

      - name: Play upload skipped
        if: steps.ks.outputs.signed != 'true' || steps.play.outputs.set != 'true'
        run: echo "::notice::Play upload skipped${{ inputs.upload_listing && ', store listing too' || '' }} (signed=${{ steps.ks.outputs.signed }}, PLAY_SERVICE_ACCOUNT_JSON set=${{ steps.play.outputs.set }}). The owner's one-time steps are in docs/ANDROID-RELEASE.md."
