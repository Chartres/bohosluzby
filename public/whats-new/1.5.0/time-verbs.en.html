<!doctype html>
<meta charset="utf-8">
<!-- What's new 1.5.0 (docs/standards/whats-new.md in flywheel): CSS keyframes only, no script, nothing
     fetched. 4.5 s loop: a tap on the Mass time, and remind me · add to calendar · invite unfold under the row. -->
<style>
  :root{--paper:#f6f1e5;--ink:#1a1712;--faded:#655c4d;--hair:#d8d0bd;--season:#3d6b46}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.3 'Source Sans 3',system-ui,sans-serif;overflow:hidden}
  .f{position:relative;padding:18px 16px 0;box-sizing:border-box;height:100%}
  .day{color:#9a2b1e;font-size:12px;font-weight:600;letter-spacing:.12em;border-bottom:1px solid var(--hair);padding-bottom:8px}
  .row{display:flex;gap:14px;padding-top:14px}
  .t{font:700 30px/1 'Fraunces Variable',Georgia,serif;animation:tap 4.5s infinite}
  .t small{display:block;font:13px/1.6 'Source Sans 3',system-ui,sans-serif;color:var(--faded)}
  .t i{font-style:normal;display:inline-block;animation:flip 4.5s infinite}
  .n{font:600 19px/1.2 'Fraunces Variable',Georgia,serif;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:4px}
  .n small{display:block;margin-top:6px;font:14px 'Source Sans 3',system-ui,sans-serif;color:var(--faded);text-decoration:none}
  .v{display:flex;gap:12px;font-size:14px;white-space:nowrap;color:var(--faded);overflow:hidden;max-height:0;opacity:0;margin-top:12px;animation:open 4.5s infinite}
  .v span{display:flex;align-items:center;gap:6px}
  .v b{width:14px;height:14px;border:1.5px solid var(--faded);border-radius:3px;box-sizing:border-box}
  .v .bell{border-radius:7px 7px 2px 2px}
  .v .env{height:11px;border-radius:1px}
  .line{border-top:1px solid var(--hair);margin-top:14px}
  .dot{position:absolute;left:30px;top:52px;width:34px;height:34px;border-radius:50%;background:var(--season);opacity:0;animation:touch 4.5s infinite}
  @keyframes tap{0%,20%,30%,100%{transform:none}24%{transform:scale(.95)}}
  @keyframes touch{0%,17%{opacity:0;transform:scale(.5)}24%{opacity:.28;transform:scale(1)}34%,100%{opacity:0}}
  @keyframes open{0%,26%{max-height:0;opacity:0}38%,88%{max-height:30px;opacity:1}96%,100%{max-height:0;opacity:0}}
  @keyframes flip{0%,26%{transform:none}32%,90%{transform:rotate(180deg)}96%,100%{transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.v{max-height:30px;opacity:1}.t i{transform:rotate(180deg)}.dot{display:none}}
</style>
<div class="f" aria-hidden="true">
  <div class="day">TODAY</div>
  <div class="row">
    <div class="t">12:15<small>in 23 min <i>▾</i></small></div>
    <div class="n">St Thomas church<small>Brno · 300 m</small></div>
  </div>
  <div class="v"><span><b class="bell"></b>remind me</span><span><b></b>add to calendar</span><span><b class="env"></b>invite</span></div>
  <div class="line"></div>
  <div class="dot"></div>
</div>
